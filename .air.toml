# Go hot reload for `just dev`. The frontend reloads through Vite, so web/ is not watched here.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/spotter ./cmd/spotter"
  entrypoint = ["./tmp/spotter"]
  include_dir = ["cmd", "internal"]
  include_ext = ["go"]
  exclude_regex = ["_test\\.go$"]
  delay = 200
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = true

[misc]
  clean_on_exit = true
